{{ define "main" }}
<section class="px-edge-margin-mobile lg:px-edge-margin-desktop py-section-gap min-h-[60vh] flex items-center">
  <div class="max-w-[1440px] mx-auto">
    <p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-gutter">Error 404</p>
    <h1 class="font-display-xl text-display-xl-mobile lg:text-display-xl uppercase tracking-tighter mb-gutter">Not found</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mb-section-gap">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ .Site.Home.RelPermalink }}" class="font-label-caps text-label-caps uppercase text-primary border-b border-primary pb-1">Return home</a>
  </div>
</section>
{{ end }}
